[tool.poetry]
name = "lim-ai-copilot-server"
version = "0.1.0"
description = "Mock Remote Server for LIM-AI Copilot"
authors = ["LIM-AI Copilot Contributors"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
litellm = "^1.34.0"
faster-whisper = "^1.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
