<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>AI LIM Assistant Copilot</title>
    <!-- KaTeX per Matematica -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- Plotly.js per Grafici Interattivi -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <!-- Mermaid.js per Mappe Concettuali -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Model-Viewer per Oggetti 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <!-- html2canvas per PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF per PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.woff') format('woff');
        }

        body { font-family: Arial, sans-serif; background: #1e1e2e; color: #cdd6f4; margin: 0; padding: 10px; }
        .dsa-mode { font-family: 'OpenDyslexic', sans-serif !important; letter-spacing: 0.12em; line-height: 1.6; }

        /* Header e Badge di Stato */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .status-online { background-color: #a6e3a1; color: #11111b; }
        .status-degraded { background-color: #f9e2af; color: #11111b; }
        .status-offline { background-color: #f38ba8; color: #11111b; }

        /* Banner Toast */
        #toast-banner { display: none; background: #fab387; color: #11111b; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }

        /* Subtitles Bar */
        #subtitles-bar { background: rgba(0,0,0,0.6); color: #a6e3a1; padding: 8px; border-radius: 6px; font-size: 13px; min-height: 22px; margin-bottom: 10px; border: 1px solid #45475a; max-height: 80px; overflow-y: auto; }

        /* Toolbar e Bottoni */
        .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
        button, select { padding: 8px 10px; background: #89b4fa; border: none; border-radius: 6px; color: #11111b; font-weight: bold; cursor: pointer; font-size: 12px; height: 32px; box-sizing: border-box; }
        button:active { background: #b4befe; }
        button.dsa { background: #f9e2af; color: #11111b; }
        button:disabled, select:disabled { background-color: #45475a !important; color: #a6adc8 !important; cursor: not-allowed; opacity: 0.6; }

        /* Content Display Area */
        #output-container { background: #181825; padding: 10px; border-radius: 8px; border: 1px solid #313244; min-height: 320px; max-height: 420px; overflow-y: auto; }
        model-viewer { width: 100%; height: 300px; }

        /* Mermaid Map Container styling */
        .mermaid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff; /* Sfondo chiaro per armonizzare con temi 'default' o 'neutral' e renderlo perfettamente leggibile */
            color: #1e1e2e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #cdd6f4;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }
        .mermaid-container svg {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .mermaid-error {
            background: #242535;
            color: #f38ba8;
            border: 1px solid #f38ba8;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
            width: 100%;
            box-sizing: border-box;
        }
        .mermaid-raw-code {
            font-family: monospace;
            background: #181825;
            color: #a6adc8;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            white-space: pre-wrap;
            margin-top: 8px;
            font-size: 11px;
            overflow-x: auto;
            text-align: left;
        }
    </style>
</head>
<body>

    <header aria-label="Intestazione e pannello di controllo">
        <div class="header">
            <h1 style="font-weight:bold; font-size:14px; margin: 0;">AI LIM Copilot</h1>
            <span id="status-badge" class="status-badge status-offline">🔴 Connessione...</span>
        </div>

        <div id="toast-banner" role="alert" aria-live="assertive"></div>
        <div id="subtitles-bar" aria-live="polite" role="status" aria-atomic="false">🎙️ Live STT: In attesa di input audio...</div>

        <nav class="toolbar" aria-label="Azioni del Copilota">
            <button onclick="toggleInputFlow('math')">📐 Math SymPy</button>
            <button onclick="triggerOCR()">📷 OCR</button>
            <button class="remote-only" data-name="🧠 Mappa" onclick="toggleInputFlow('mappa')">🧠 Mappa</button>
            <button class="remote-only" data-name="🧊 3D Model" onclick="toggleInputFlow('model')">🧊 3D Model</button>
            <button class="remote-only" data-name="❓ Quiz" onclick="triggerQuiz()">❓ Quiz</button>
            <button class="remote-only" data-name="📋 Riassumi Lezione" onclick="triggerSummary()">📋 Riassumi Lezione</button>
            <button onclick="exportToPDF()">📄 Esporta PDF</button>
            <button id="btn-subtitles" onclick="toggleSubtitles()">🎙️ Sottotitoli</button>
            <select id="subtitle-language" onchange="handleLanguageChange()" aria-label="Lingua dei sottotitoli">
                <option value="">Nessuna traduzione</option>
                <option value="en">Inglese</option>
                <option value="fr">Francese</option>
                <option value="de">Tedesco</option>
                <option value="es">Spagnolo</option>
            </select>
            <button class="dsa" onclick="toggleDSA()">👁️ DSA Mode</button>
        </nav>
    </header>

    <main id="main-content">
        <div id="inputs-area" style="display: none; background: #242535; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #45475a;">
            <div id="flow-math" class="input-flow" style="display: none; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span style="font-size: 13px; font-weight: bold; color: #cdd6f4;">📐 Inserisci Espressione Matematica:</span>
                <input type="text" id="input-math" placeholder="es. 2*x + 6 - 12" aria-label="Inserisci Espressione Matematica" onkeydown="if(event.key === 'Enter') submitMath()" style="flex-grow: 1; min-width: 200px; padding: 10px 14px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; font-size: 14px; height: 42px; box-sizing: border-box;">
                <button onclick="submitMath()" style="height: 42px; padding: 0 20px; background: #a6e3a1; color: #11111b; font-weight: bold; font-size: 14px; border: none; border-radius: 6px; cursor: pointer;">Calcola</button>
            </div>
            <div id="flow-mappa" class="input-flow" style="display: none; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span style="font-size: 13px; font-weight: bold; color: #cdd6f4;">🧠 Argomento della Mappa:</span>
                <input type="text" id="input-mappa" placeholder="es. apparato circolatorio" aria-label="Argomento della Mappa" onkeydown="if(event.key === 'Enter') submitMappa()" style="flex-grow: 1; min-width: 200px; padding: 10px 14px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; font-size: 14px; height: 42px; box-sizing: border-box;">
                <button onclick="submitMappa()" style="height: 42px; padding: 0 20px; background: #a6e3a1; color: #11111b; font-weight: bold; font-size: 14px; border: none; border-radius: 6px; cursor: pointer;">Genera</button>
            </div>
            <div id="flow-model" class="input-flow" style="display: none; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span style="font-size: 13px; font-weight: bold; color: #cdd6f4;">🧊 Nome Modello 3D:</span>
                <input type="text" id="input-model" placeholder="es. molecola acqua H2O" aria-label="Nome Modello 3D" onkeydown="if(event.key === 'Enter') submitModel()" style="flex-grow: 1; min-width: 200px; padding: 10px 14px; border-radius: 6px; border: 1px solid #45475a; background: #181825; color: #cdd6f4; font-size: 14px; height: 42px; box-sizing: border-box;">
                <button onclick="submitModel()" style="height: 42px; padding: 0 20px; background: #a6e3a1; color: #11111b; font-weight: bold; font-size: 14px; border: none; border-radius: 6px; cursor: pointer;">Cerca</button>
            </div>
        </div>

        <div id="output-container">
            <div id="output">Seleziona un'azione per iniziare.</div>
        </div>
    </main>

    <script>
        mermaid.initialize({
            startOnLoad: false,
            theme: 'neutral',
            securityLevel: 'loose',
            suppressErrorRendering: true,
            flowchart: {
                useMaxWidth: true,
                htmlLabels: true
            }
        });

        // Supprimiamo la visualizzazione predefinita dell'errore di sintassi sulla pagina
        mermaid.parseError = function(err, hash) {
            console.warn("Mermaid parsing error suppressed:", err);
        };

        const SYSTEM_STATES = {
            ONLINE: { class: "status-online", text: "🟢 Online (Full AI)" },
            DEGRADED: { class: "status-degraded", text: "🟡 Locale (Modalità Base)" },
            OFFLINE: { class: "status-offline", text: "🔴 Disconnesso" }
        };

        let currentState = SYSTEM_STATES.OFFLINE;
        let ws = null;
        let reconnectTimeoutId = null;
        let lessonLog = [];
        let lastGeneratedSummary = "";
        let modelSelectionInFlight = false;
        const sessionStartTime = new Date();

        function connectWebSocket() {
            // Avoid creating overlapping WebSocket connections
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }

            // Clear any scheduled reconnection timeouts
            if (reconnectTimeoutId) {
                clearTimeout(reconnectTimeoutId);
                reconnectTimeoutId = null;
            }

            ws = new WebSocket("ws://127.0.0.1:5000/ws");

            ws.onopen = () => {
                setSystemState(SYSTEM_STATES.ONLINE);
                if (subtitlesActive) {
                    ws.send(JSON.stringify({
                        action: "start_transcription",
                        data: { target_language: getSubtitleLanguage() }
                    }));
                }
            };

            ws.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    console.error("Errore nel parsing del payload JSON:", e);
                    const toast = document.getElementById("toast-banner");
                    toast.innerText = "ℹ️ Errore di comunicazione con il demone locale.";
                    toast.style.display = "block";
                    setTimeout(() => { toast.style.display = "none"; }, 5000);
                    return;
                }

                if (data.action === "concept_map_status") {
                    handleConceptMapStatus(data);
                    return;
                }

                if (data.type === "system_warning") {
                    setSystemState(SYSTEM_STATES.DEGRADED, data.message);
                    return;
                }

                if (data.type === "pong_remote") {
                    if (currentState === SYSTEM_STATES.DEGRADED) {
                        setSystemState(SYSTEM_STATES.ONLINE, "Connessione Cloud Ripristinata!");
                    }
                    return;
                }

                if (data.type === "subtitle") {
                    handleSubtitleMessage(data);
                    return;
                }

                if (data.type === "tts_audio") {
                    handleTTSAudioMessage(data);
                    return;
                }

                renderData(data);
            };

            ws.onclose = () => {
                setSystemState(SYSTEM_STATES.OFFLINE, "Demone locale non raggiungibile. Riconnessione in corso...");

                // Clean up websocket instance
                ws = null;

                // Schedule reconnection safely
                if (!reconnectTimeoutId) {
                    reconnectTimeoutId = setTimeout(connectWebSocket, 3000);
                }
            };
        }

        function handleConceptMapStatus(data) {
            const out = document.getElementById("output");
            if (!out) return;

            if (data.status === "loading") {
                out.innerHTML = `
                    <div id="concept-map-spinner" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px;">
                        <div class="spinner" style="border: 4px solid rgba(255, 255, 255, 0.1); width: 42px; height: 42px; border-radius: 50%; border-left-color: #89b4fa; animation: spin 1s linear infinite;"></div>
                        <style>
                            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                        </style>
                        <p style="margin-top: 15px; font-weight: bold; color: #89b4fa;">${escapeHTML(data.message)}</p>
                    </div>
                `;
            } else if (data.status === "error") {
                out.innerHTML = `
                    <div style="color: #f38ba8; font-weight: bold; text-align: center; margin-top: 50px;">
                        ⚠️ ${escapeHTML(data.message)}
                    </div>
                `;
            }
        }

        function setSystemState(newState, message = "") {
            const oldState = currentState;
            currentState = newState;
            const badge = document.getElementById("status-badge");
            badge.className = `status-badge ${newState.class}`;
            badge.innerText = newState.text;

            const isDegradedOrOffline = (newState !== SYSTEM_STATES.ONLINE);
            document.querySelectorAll(".remote-only").forEach(btn => {
                btn.disabled = isDegradedOrOffline;
                const baseName = btn.dataset.name;
                btn.innerText = isDegradedOrOffline ? `${baseName} ☁️❌` : baseName;
            });

            const selectEl = document.getElementById("subtitle-language");
            if (selectEl) {
                selectEl.disabled = isDegradedOrOffline;
            }

            if (subtitlesActive && (oldState === SYSTEM_STATES.DEGRADED || oldState === SYSTEM_STATES.OFFLINE) && newState === SYSTEM_STATES.ONLINE) {
                const toast = document.getElementById("toast-banner");
                toast.innerText = "ℹ️ Sottotitoli: passaggio alla trascrizione cloud";
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 5000);
            } else if (message) {
                const toast = document.getElementById("toast-banner");
                toast.innerText = `ℹ️ ${message}`;
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 5000);
            }

            checkSubtitleConnectionState();
        }

        async function renderData(data) {
            if (!data) return;
            modelSelectionInFlight = false;

            if (data.type === "error") {
                const toast = document.getElementById("toast-banner");
                if (toast) {
                    toast.innerText = `⚠️ Errore [${data.code || "UNKNOWN"}]: ${data.message || "Errore imprevisto"}`;
                    toast.style.display = "block";
                    setTimeout(() => { toast.style.display = "none"; }, 5000);
                }
                return;
            }

            const out = document.getElementById("output");
            out.innerHTML = "";

            if (data.type === "model_search_results") {
                const results = data.results || [];
                if (results.length === 0) {
                    const toast = document.getElementById("toast-banner");
                    if (toast) {
                        toast.innerText = "⚠️ Errore [MODEL_NOT_FOUND]: Nessun modello 3D trovato per la ricerca.";
                        toast.style.display = "block";
                        setTimeout(() => { toast.style.display = "none"; }, 5000);
                    }
                    out.innerHTML = `<div style="color: #f38ba8; font-weight: bold; text-align: center; margin-top: 50px;">⚠️ Nessun modello 3D trovato per la ricerca.</div>`;
                    return;
                }

                let html = `
                    <div style="font-weight: bold; font-size: 14px; margin-bottom: 12px; color: #cdd6f4;">Risultati Ricerca Modelli 3D:</div>
                    <div class="model-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;">
                `;

                results.forEach(item => {
                    const thumbUrl = item.thumbnail_url || "https://sketchfab.com/static/images/placeholders/placeholder-model.png";
                    html += `
                        <button class="model-card" onclick="selectModel('${escapeHTML(item.uid)}')" style="display: flex; flex-direction: column; background: #242535; border: 1px solid #45475a; border-radius: 8px; padding: 10px; cursor: pointer; text-align: left; width: 100%; min-height: 180px; box-sizing: border-box; transition: background 0.2s;" data-uid="${escapeHTML(item.uid)}">
                            <img src="${escapeHTML(thumbUrl)}" alt="${escapeHTML(item.name)}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 4px; background: #11111b; margin-bottom: 8px; pointer-events: none;" />
                            <div style="font-weight: bold; font-size: 12px; color: #cdd6f4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-bottom: 4px; pointer-events: none;">${escapeHTML(item.name)}</div>
                            <div style="font-size: 11px; color: #a6adc8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; margin-bottom: 6px; pointer-events: none;">Da: ${escapeHTML(item.author)}</div>
                            <span style="font-size: 9px; font-weight: bold; background: #f9e2af; color: #11111b; padding: 2px 6px; border-radius: 4px; pointer-events: none; align-self: flex-start;">${escapeHTML(item.license)}</span>
                        </button>
                    `;
                });

                html += `
                    </div>
                    <style>
                        .model-card:hover { background: #313244 !important; }
                        .model-card:focus { border-color: #89b4fa !important; outline: none; }
                    </style>
                `;
                out.innerHTML = html;
            } else if (data.type === "summary") {
                const text = data.text || data.summary || "";
                lastGeneratedSummary = text;
                const normalizedText = text.replace(/\r\n/g, "\n");
                const paragraphs = normalizedText.split("\n\n");
                let html = "";
                paragraphs.forEach(para => {
                    const trimmed = para.trim();
                    if (trimmed) {
                        html += `<p>${escapeHTML(trimmed)}</p>`;
                    }
                });
                // Add TTS Listen button and audio player
                html += `
                    <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
                        <button onclick="synthesizeSummary()" style="padding: 8px 12px; font-weight: bold; border-radius: 6px; background: #a6e3a1; color: #11111b; border: none; cursor: pointer;">🔊 Ascolta</button>
                        <audio id="tts-audio-player" name="tts-audio-player" controls style="display: none; height: 32px;"></audio>
                    </div>
                `;
                out.innerHTML = html;
            } else if (data.type === "math") {
                lessonLog.push({
                    type: "math",
                    content: `Espressione matematica: ${data.latex}`,
                    timestamp: new Date().toISOString()
                });

                const formulaContainer = document.createElement("div");
                formulaContainer.id = "math-formula";
                out.appendChild(formulaContainer);
                katex.render(data.latex, formulaContainer, { displayMode: true });

                if (data.plot_data) {
                    const chartContainer = document.createElement("div");
                    chartContainer.id = "math-chart";
                    chartContainer.style.width = "100%";
                    chartContainer.style.minHeight = "300px";
                    chartContainer.style.marginTop = "15px";
                    chartContainer.style.backgroundColor = "#1e1e2e";
                    out.appendChild(chartContainer);

                    try {
                        Plotly.purge(chartContainer);
                    } catch (e) {
                        // ignore
                    }

                    const trace = {
                        x: data.plot_data.x,
                        y: data.plot_data.y,
                        type: 'scatter',
                        mode: 'lines',
                        line: { color: '#89b4fa', width: 3 },
                        name: 'f(x)'
                    };

                    const layout = {
                        title: {
                            text: 'Grafico della Funzione',
                            font: { color: '#cdd6f4', size: 16 }
                        },
                        paper_bgcolor: '#1e1e2e',
                        plot_bgcolor: '#1e1e2e',
                        xaxis: {
                            gridcolor: '#313244',
                            zerolinecolor: '#45475a',
                            tickfont: { color: '#cdd6f4', size: 12 },
                            title: { text: 'x', font: { color: '#cdd6f4' } }
                        },
                        yaxis: {
                            gridcolor: '#313244',
                            zerolinecolor: '#45475a',
                            tickfont: { color: '#cdd6f4', size: 12 },
                            title: { text: 'y', font: { color: '#cdd6f4' } }
                        },
                        margin: { t: 40, b: 40, l: 50, r: 20 },
                        showlegend: false
                    };

                    const config = {
                        responsive: true,
                        displaylogo: false,
                        scrollZoom: true,
                        doubleClick: 'reset'
                    };

                    Plotly.newPlot(chartContainer, [trace], layout, config);
                }
            } else if (data.type === "concept_map") {
                const rawCode = data.mermaid_code || "";
                const sanitizedCode = sanitizeMermaidCode(rawCode);

                lessonLog.push({
                    type: "concept_map",
                    content: `Mappa concettuale: ${sanitizedCode}`,
                    timestamp: new Date().toISOString()
                });

                if (!sanitizedCode) {
                    out.innerHTML = `
                        <div class="mermaid-error">
                            <strong>⚠️ Mappa non generabile</strong>
                            <p>Il codice della mappa concettuale generato dall'AI è vuoto o non valido.</p>
                            <div class="mermaid-raw-code">${escapeHTML(rawCode)}</div>
                        </div>
                    `;
                } else {
                    // Genera un ID univoco per il rendering di questa istanza del diagramma
                    const uniqueId = `mermaid-render-${Date.now()}`;
                    try {
                        // Utilizziamo l'API render di Mermaid.js per catturare e gestire eventuali eccezioni di sintassi
                        const { svg } = await mermaid.render(uniqueId, sanitizedCode);
                        out.innerHTML = `<div class="mermaid-container">${svg}</div>`;
                    } catch (error) {
                        console.error("Errore di rendering Mermaid.js:", error);
                        // Rimuoviamo l'elemento temporaneo inserito da Mermaid.js nel body che altrimenti rimarrebbe orfano
                        const leakedEl = document.getElementById(`d${uniqueId}`);
                        if (leakedEl) {
                            leakedEl.remove();
                        }
                        out.innerHTML = `
                            <div class="mermaid-error">
                                <strong>⚠️ Mappa non generabile (Errore di sintassi)</strong>
                                <p>Non è stato possibile renderizzare la mappa concettuale a causa di un errore di sintassi nel codice generato dall'AI.</p>
                                <div class="mermaid-raw-code">${escapeHTML(sanitizedCode)}</div>
                            </div>
                        `;
                    }
                }
            } else if (data.type === "model_3d") {
                let html = `<model-viewer src="${data.model_url}" camera-controls auto-rotate shadow-intensity="1"></model-viewer>`;

                if (data.attribution) {
                    const author = escapeHTML(data.attribution.author || "Autore sconosciuto");
                    const license = escapeHTML(data.attribution.license || "Licenza sconosciuta");
                    const url = data.attribution.source_url ? escapeHTML(data.attribution.source_url) : "";

                    html += `<div style="font-size: 11px; color: #a6adc8; margin-top: 6px; text-align: center;">`;
                    if (url) {
                        html += `Modello: <a href="${url}" target="_blank" style="color: #89b4fa; text-decoration: none; font-weight: bold;">${escapeHTML(data.label || "Modello 3D")}</a>`;
                    } else {
                        html += `Modello: <b>${escapeHTML(data.label || "Modello 3D")}</b>`;
                    }
                    html += ` | Autore: <i>${author}</i> | Licenza: <span style="color: #f9e2af;">${license}</span>`;
                    html += `</div>`;
                }

                out.innerHTML = html;
            } else if (data.type === "quiz") {
                lessonLog.push({
                    type: "quiz",
                    content: `Quiz: ${data.questions.map(q => q.question).join("; ")}`,
                    timestamp: new Date().toISOString()
                });
                const correctIndices = data.questions.map(q => q.correct_index);

                let html = "<b>Quiz di Verifica Rapida</b><hr>";
                data.questions.forEach((q, i) => {
                    html += `<p><b>${i+1}. ${q.question}</b></p>`;
                    html += `<div class="quiz-question" id="quiz-q-${i}">`;
                    q.options.forEach((opt, j) => {
                        html += `<label id="quiz-q-${i}-lbl-${j}"><input type="radio" name="q${i}" value="${j}" aria-label="${escapeHTML(opt)}"> ${escapeHTML(opt)}</label><br>`;
                    });
                    html += `</div>`;
                });

                out.innerHTML = html;

                // Add button below the quiz
                const btnVerifica = document.createElement("button");
                btnVerifica.id = "btn-verify-quiz";
                btnVerifica.innerText = "📐 Verifica Risposte";
                btnVerifica.style.marginTop = "12px";
                btnVerifica.onclick = () => {
                    // Disable all radios
                    out.querySelectorAll("input[type='radio']").forEach(radio => {
                        radio.disabled = true;
                    });
                    btnVerifica.disabled = true;

                    // Verify answers
                    correctIndices.forEach((correctIdx, i) => {
                        const radios = out.querySelectorAll(`input[name="q${i}"]`);
                        let selectedIdx = -1;
                        radios.forEach((radio, rIdx) => {
                            if (radio.checked) {
                                selectedIdx = rIdx;
                            }
                        });

                        radios.forEach((radio, rIdx) => {
                            const lbl = document.getElementById(`quiz-q-${i}-lbl-${rIdx}`);
                            if (!lbl) return;
                            if (rIdx === correctIdx) {
                                // Mark correct option in green with checkmark
                                lbl.innerHTML = `✓ ${lbl.innerHTML} <b>[Corretto]</b>`;
                                lbl.style.backgroundColor = "rgba(166, 227, 161, 0.3)";
                                lbl.style.color = "#a6e3a1";
                                lbl.style.fontWeight = "bold";
                                lbl.style.borderRadius = "4px";
                                lbl.style.padding = "2px 6px";
                                lbl.style.display = "inline-block";
                            } else if (rIdx === selectedIdx) {
                                // Student picked wrong option - mark in red with crossmark
                                lbl.innerHTML = `✗ ${lbl.innerHTML} <b>[Scelta errata]</b>`;
                                lbl.style.backgroundColor = "rgba(243, 139, 168, 0.3)";
                                lbl.style.color = "#f38ba8";
                                lbl.style.borderRadius = "4px";
                                lbl.style.padding = "2px 6px";
                                lbl.style.display = "inline-block";
                            }
                        });
                    });
                };
                out.appendChild(btnVerifica);
            }
        }

        function formatSessionFilename() {
            const pad = (num) => String(num).padStart(2, '0');
            const yyyy = sessionStartTime.getFullYear();
            const mm = pad(sessionStartTime.getMonth() + 1);
            const dd = pad(sessionStartTime.getDate());
            const hh = pad(sessionStartTime.getHours());
            const min = pad(sessionStartTime.getMinutes());
            return `lezione_${yyyy}-${mm}-${dd}_${hh}${min}.pdf`;
        }

        async function exportToPDF() {
            if (!window.html2canvas || !window.jspdf) {
                const toast = document.getElementById("toast-banner");
                toast.innerText = "Errore: Impossibile esportare il PDF. Le librerie html2canvas o jsPDF non sono state caricate (connessione CDN assente o bloccata).";
                toast.style.display = "block";
                setTimeout(() => { toast.style.display = "none"; }, 5000);
                return;
            }

            const { jsPDF } = window.jspdf;
            const html2canvas = window.html2canvas;
            const doc = new jsPDF();
            let currentY = 15;

            // Header Title
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(16);
            doc.text("AI LIM Copilot — Report Lezione", 15, currentY);
            currentY += 10;

            // Log lessonStartTime
            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Inizio Sessione: ${sessionStartTime.toLocaleString('it-IT')}`, 15, currentY);
            currentY += 10;

            // 1. Render the current lessonLog as a simple text section at the top of the PDF.
            doc.setFont("Helvetica", "bold");
            doc.setFontSize(12);
            doc.text("Registro Attività (Lesson Log):", 15, currentY);
            currentY += 6;

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            if (lessonLog.length === 0) {
                doc.text("Nessuna attività registrata in questa sessione.", 15, currentY);
                currentY += 6;
            } else {
                lessonLog.forEach(entry => {
                    const timeStr = new Date(entry.timestamp).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    const typeStr = entry.type.toUpperCase();
                    const textLine = `[${timeStr}] [${typeStr}] ${entry.content}`;

                    const splitLines = doc.splitTextToSize(textLine, 180);
                    splitLines.forEach(line => {
                        if (currentY > 280) {
                            doc.addPage();
                            currentY = 15;
                        }
                        doc.text(line, 15, currentY);
                        currentY += 5;
                    });
                });
                currentY += 5;
            }

            // 2. If a summary was already generated, include its full text.
            if (lastGeneratedSummary) {
                if (currentY > 250) {
                    doc.addPage();
                    currentY = 15;
                }
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(12);
                doc.text("Sintesi della Lezione:", 15, currentY);
                currentY += 6;

                doc.setFont("Helvetica", "normal");
                doc.setFontSize(10);

                const summaryParagraphs = lastGeneratedSummary.split("\n\n");
                summaryParagraphs.forEach(para => {
                    const splitSummary = doc.splitTextToSize(para.trim(), 180);
                    splitSummary.forEach(line => {
                        if (currentY > 280) {
                            doc.addPage();
                            currentY = 15;
                        }
                        doc.text(line, 15, currentY);
                        currentY += 5;
                    });
                    currentY += 4;
                });
                currentY += 5;
            }

            // 3. Capture #output-container using html2canvas
            const container = document.getElementById("output-container");
            if (container) {
                try {
                    const canvas = await html2canvas(container, {
                        useCORS: true,
                        allowTaint: true,
                        scale: 2
                    });
                    const imgData = canvas.toDataURL("image/png");

                    if (currentY > 180) {
                        doc.addPage();
                        currentY = 15;
                    }

                    doc.setFont("Helvetica", "bold");
                    doc.setFontSize(12);
                    doc.text("Visualizzazione Attuale della Lavagna:", 15, currentY);
                    currentY += 6;

                    const imgWidth = 180;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;

                    doc.addImage(imgData, "PNG", 15, currentY, imgWidth, imgHeight);
                } catch (e) {
                    console.error("html2canvas capture failed: ", e);
                }
            }

            // Save PDF
            doc.save(formatSessionFilename());
        }

        let subtitlesActive = false;

        function sanitizeMermaidCode(text) {
            if (!text) return "";

            // 1. Rimuovi blocchi di codice markdown (```mermaid ... ``` o ``` ... ```)
            let cleaned = text;

            // Cerca prima il blocco ```mermaid o ``` e cattura tutto quello che c'è all'interno
            const markdownRegex = /```(?:mermaid)?([\s\S]*?)```/i;
            const match = markdownRegex.exec(cleaned);
            if (match) {
                cleaned = match[1];
            } else {
                // Se non ci sono blocchi markdown ma ci sono frammenti residui isolati come ``` o ```mermaid
                cleaned = cleaned.replace(/```mermaid/gi, "").replace(/```/g, "");
            }

            // 2. Rimuovi eventuale testo introduttivo/conclusivo
            // Mermaid di solito inizia con graph, flowchart, sequenceDiagram, classDiagram, stateDiagram, erDiagram, gantt, pie, journey, gitGraph, C4Diagram, mindmap, timeline, zenuml, sankey, xyChart, block, packet, kanban, architecture, db, ecc.
            const mermaidKeywords = [
                "graph", "flowchart", "sequenceDiagram", "classDiagram", "stateDiagram",
                "erDiagram", "gantt", "pie", "journey", "gitGraph", "C4Diagram", "mindmap",
                "timeline", "zenuml", "sankey", "xyChart", "block", "packet", "kanban", "architecture"
            ];

            // Troviamo la prima occorrenza di una delle keyword di Mermaid
            let earliestIndex = -1;
            let matchedKeyword = "";
            for (const kw of mermaidKeywords) {
                const regex = new RegExp("\\b" + kw + "\\b", "i");
                const searchMatch = regex.exec(cleaned);
                if (searchMatch) {
                    const idx = searchMatch.index;
                    if (earliestIndex === -1 || idx < earliestIndex) {
                        earliestIndex = idx;
                        matchedKeyword = kw;
                    }
                }
            }

            if (earliestIndex !== -1) {
                // Estrai a partire dalla keyword trovata
                cleaned = cleaned.substring(earliestIndex);
            }

            // Pulizia finale degli spazi bianchi, ritorni a capo e righe vuote prima/dopo
            cleaned = cleaned.trim();

            // Alcuni LLM potrebbero generare testo conversazionale in fondo;
            // cerchiamo di tagliare via tutto quello che segue l'ultimo elemento valido se finisce con testo strano.
            // In genere non c'è una chiusura fissa per Mermaid, ma possiamo rimuovere righe finali isolate che contengono spiegazioni o commenti (purché non siano commenti Mermaid che iniziano con %%)
            const lines = cleaned.split("\n");
            const cleanedLines = [];
            let inDiagram = true;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // Se incontriamo una linea in fondo che sembra testo descrittivo non-mermaid (es. "Spero che questa mappa...", "Ecco la mappa...")
                // In genere le righe di Mermaid contengono freccia (-->), due punti (:), parentesi, o definiscono nodi/connessioni.
                // Se siamo oltre la prima metà delle righe e troviamo una riga puramente testuale senza sintassi tipica di Mermaid, potremmo interrompere.
                // Tuttavia per sicurezza, evitiamo euristiche troppo aggressive per non tagliare nodi validi.
                // Rimuoviamo però righe che iniziano chiaramente con markdown estraneo o spiegazioni se il diagramma è già terminato.
                cleanedLines.push(lines[i]);
            }

            cleaned = cleanedLines.join("\n").trim();
            return cleaned;
        }

        function escapeHTML(str) {
            if (!str) return "";
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function startLocalSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                const bar = document.getElementById("subtitles-bar");
                if (bar) {
                    bar.innerText = "Sottotitoli non disponibili: browser non supportato";
                }
                return;
            }

            if (recognitionActive) {
                return;
            }

            try {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'it-IT';

                recognition.onstart = () => {
                    recognitionActive = true;
                    updateSubtitlesDisplay();
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const result = event.results[i];
                        if (result.isFinal) {
                            const finalText = result[0].transcript.trim();
                            if (finalText) {
                                handleSubtitleMessage({
                                    type: 'subtitle',
                                    text: finalText,
                                    is_final: true
                                });
                            }
                        } else {
                            interimTranscript += result[0].transcript;
                        }
                    }

                    if (interimTranscript) {
                        handleSubtitleMessage({
                            type: 'subtitle',
                            text: interimTranscript.trim(),
                            is_final: false
                        });
                    } else if (event.results.length > 0 && event.results[event.results.length - 1].isFinal) {
                        interimSubtitle = null;
                        updateSubtitlesDisplay();
                    }
                };

                recognition.onerror = (event) => {
                    console.error("SpeechRecognition error:", event.error);
                };

                recognition.onend = () => {
                    if (recognitionActive && subtitlesActive && (currentState === SYSTEM_STATES.DEGRADED || currentState === SYSTEM_STATES.OFFLINE)) {
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error("Failed to auto-restart SpeechRecognition:", e);
                        }
                    } else {
                        recognitionActive = false;
                        recognition = null;
                    }
                };

                recognitionActive = true;
                recognition.start();
            } catch (err) {
                console.error("Failed to start SpeechRecognition:", err);
                recognitionActive = false;
                recognition = null;
            }
        }

        function stopLocalSpeechRecognition() {
            recognitionActive = false;
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {
                    // Ignore
                }
                recognition = null;
            }
        }

        function toggleSubtitles() {
            subtitlesActive = !subtitlesActive;
            const btn = document.getElementById("btn-subtitles");
            const bar = document.getElementById("subtitles-bar");
            if (subtitlesActive) {
                btn.style.background = "#a6e3a1"; // Green color
                checkSubtitleConnectionState();
            } else {
                btn.style.background = "#89b4fa"; // Standard button color
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        action: "stop_transcription"
                    }));
                }
                stopLocalSpeechRecognition();
                finalSubtitles = [];
                interimSubtitle = null;
                bar.innerText = "🎙️ Live STT: In attesa di input audio...";
            }
        }

        function checkSubtitleConnectionState() {
            const bar = document.getElementById("subtitles-bar");
            if (!bar) return;

            const selectEl = document.getElementById("subtitle-language");
            const isDegradedOrOffline = (currentState !== SYSTEM_STATES.ONLINE);
            if (selectEl) {
                selectEl.disabled = isDegradedOrOffline;
            }

            if (subtitlesActive) {
                if (isDegradedOrOffline) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        bar.innerText = "Sottotitoli non disponibili: browser non supportato";
                    } else {
                        startLocalSpeechRecognition();
                    }
                } else {
                    stopLocalSpeechRecognition();
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            action: "start_transcription",
                            data: { target_language: getSubtitleLanguage() }
                        }));
                    }
                    updateSubtitlesDisplay();
                }
            }
        }

        function handleSubtitleMessage(data) {
            if (!subtitlesActive) return;

            const text = escapeHTML(data.text);
            const translated = data.translated_text ? escapeHTML(data.translated_text) : "";
            const displayText = translated ? `${text} (${translated})` : text;

            if (data.is_final) {
                finalSubtitles.push(displayText);
                interimSubtitle = null;
                lessonLog.push({
                    type: "subtitle",
                    content: data.translated_text ? `${data.text} (${data.translated_text})` : data.text,
                    timestamp: new Date().toISOString()
                });
            } else {
                interimSubtitle = displayText;
            }

            updateSubtitlesDisplay();
        }

        function updateSubtitlesDisplay() {
            const bar = document.getElementById("subtitles-bar");
            if (!bar) return;

            if (!subtitlesActive) {
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if ((currentState === SYSTEM_STATES.DEGRADED || currentState === SYSTEM_STATES.OFFLINE) && !SpeechRecognition) {
                bar.innerText = "Sottotitoli non disponibili: browser non supportato";
                return;
            }

            let html = "";
            finalSubtitles.forEach(sub => {
                html += `<div>${sub}</div>`;
            });

            if (interimSubtitle) {
                html += `<div><i>${interimSubtitle}</i></div>`;
            }

            if (finalSubtitles.length === 0 && !interimSubtitle) {
                bar.innerHTML = "🎙️ Live STT: In ascolto...";
            } else {
                bar.innerHTML = html;
                bar.scrollTop = bar.scrollHeight;
            }
        }

        // Loop di Health Check per Auto-Riconnessione Cloud
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN && currentState === SYSTEM_STATES.DEGRADED) {
                ws.send(JSON.stringify({ action: "ping_remote" }));
            }
        }, 8000);

        connectWebSocket();
    </script>
