[tool.poetry]
name = "lim-ai-copilot-daemon"
version = "0.1.0"
description = "FastAPI Local Bridge Daemon for LIM-AI Copilot"
authors = ["LIM-AI Copilot Contributors"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
httpx = "^0.25.0"
mss = "^10.0.0"
pillow = "^10.0.0"
sympy = "^1.12"
pyyaml = "^6.0.1"
pytesseract = "^0.3.13"
pyaudio = "^0.2.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
